name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  CF_PAGES_BRANCH: ${{ github.ref_name }}

jobs:
  # =========================================================================
  # 1. LINT & TYPE CHECK (fail fast)
  # =========================================================================
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run build --if-present

  # =========================================================================
  # 2. DEPLOY TO CLOUDFLARE PAGES (Preview for PR, Production for main)
  # =========================================================================
  deploy-pages:
    name: Deploy to Cloudflare Pages
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build-time env vars (public)
          VITE_APP_TITLE: "Chụp Gì Bây Giờ"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: chupgibaygio
          directory: dist
          branch: ${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Preview deployment for PRs, production for main
          wranglerVersion: 'latest'

  # =========================================================================
  # 3. DEPLOY WORKERS (if you have API functions)
  # =========================================================================
  deploy-workers:
    name: Deploy Cloudflare Workers
    needs: lint-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Workers
        run: wrangler deploy --env production --config wrangler-worker.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Worker secrets (set via wrangler secret put or dashboard)
          # DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          # R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  # =========================================================================
  # 4. NOTIFY (optional - Slack, Discord, Telegram)
  # =========================================================================
  notify:
    name: Notify Deployment
    needs: [deploy-pages, deploy-workers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment status
        run: |
          echo "✅ Deploy completed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Pages: https://${{ github.ref_name == 'main' && 'chupgibaygio.pages.dev' || github.ref_name }}.chupgibaygio.pages.dev"
          # Add your notification webhook here (Slack/Discord/Telegram)