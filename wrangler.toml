name = "chupgibaygio"
main = "src/workers/frontend.ts"
compatibility_date = "2024-10-02"

[assets]
binding = "ASSETS"
directory = "./dist"
# Client routes (/join/*, /admin/*, /tao-anh, …): serve index.html on refresh — do NOT use public/_redirects (Workers rejects Pages-style /* → /index.html rules).
not_found_handling = "single-page-application"
run_worker_first = true
