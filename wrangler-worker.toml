name = "chupgibaygio-api"
main = "src/workers/index.ts"
compatibility_date = "2024-10-02"
compatibility_flags = ["nodejs_compat"]


# Environment variables (non-secret)
[vars]
APP_ENV = "production"
LOG_LEVEL = "info"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "chupgibaygio-db"
database_id = "7ca25a88-df29-4a3a-8988-ced043d783d9"

# R2 Bucket binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "chupgibaygio"

# KV Namespace for caching (optional)
[[kv_namespaces]]
binding = "CACHE"
id = "1cd9b5e4effe4af68e27decc4f19912c"

# AI binding (if using Cloudflare AI)
# [ai]
# binding = "AI"

# Custom domain (configure in Cloudflare dashboard after first deploy)
# routes = [
#   { pattern = "api.chupgibaygio.com/*", zone_name = "chupgibaygio.com" }
# ]

# --- Development overrides ---
[env.dev]
name = "chupgibaygio-api-dev"
vars = { APP_ENV = "development", LOG_LEVEL = "debug" }
[[env.dev.d1_databases]]
binding = "DB"
database_name = "chupgibaygio-db-dev"
database_id = "your-dev-d1-database-id"

# --- Staging/Preview ---
[env.staging]
name = "chupgibaygio-api-staging"
vars = { APP_ENV = "staging", LOG_LEVEL = "info" }
[[env.staging.d1_databases]]
binding = "DB"
database_name = "chupgibaygio-db-staging"
database_id = "your-staging-d1-database-id"
[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "chupgibaygio-assets-staging"
[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "your-staging-kv-namespace-id"

# --- Production ---
[env.production]
name = "chupgibaygio-api"
vars = { APP_ENV = "production", LOG_LEVEL = "info" }
routes = [
  { pattern = "chupgibaygio.com/api/*", zone_name = "chupgibaygio.com" },
  { pattern = "www.chupgibaygio.com/api/*", zone_name = "chupgibaygio.com" }
]
[[env.production.d1_databases]]
binding = "DB"
database_name = "chupgibaygio-db"
database_id = "7ca25a88-df29-4a3a-8988-ced043d783d9"
[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "chupgibaygio"
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "1cd9b5e4effe4af68e27decc4f19912c"