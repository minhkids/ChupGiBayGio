name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # =========================================================================
  # 1. LINT & TYPE CHECK (fail fast)
  # =========================================================================
  lint-and-typecheck:
    name: Lint, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Build API Worker
        run: npm run build:worker

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

  # =========================================================================
  # 2. DEPLOY BOTH PRODUCTION WORKERS (never from a pull request)
  # =========================================================================
  deploy-production:
    name: Deploy Production Workers
    needs: lint-and-typecheck
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing Actions secret CLOUDFLARE_API_TOKEN. Add a scoped Cloudflare API token in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing Actions variable CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download verified frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Deploy API Worker
        # Keep the deploy CLI isolated from this repo's Wrangler 3/types 4 dependencies.
        run: npx --yes wrangler@4.149.0 deploy --env production --config wrangler-worker.toml --keep-vars

      - name: Deploy frontend Worker
        run: npx --yes wrangler@4.149.0 deploy --config wrangler.toml --keep-vars

      - name: Verify production responses
        run: |
          curl --fail --silent --show-error --retry 3 https://chupgibaygio.com/ -o /dev/null
          curl --fail --silent --show-error --retry 3 https://chupgibaygio.com/api/services -o services.json
          node --input-type=module -e "import fs from 'node:fs'; if (!Array.isArray(JSON.parse(fs.readFileSync('services.json', 'utf8')))) throw new Error('Expected a JSON services array');"

      - name: Report successful deployment
        run: |
          {
            echo "Production frontend and API deployed and HTTP checks passed."
            echo "Commit: $GITHUB_SHA"
            echo "Website: https://chupgibaygio.com/"
          } >> "$GITHUB_STEP_SUMMARY"